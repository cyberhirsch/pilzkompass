name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Assemble offline web bundle
        working-directory: app
        run: |
          pip install requests pillow
          npm ci
          python ../tools/build-app.py
      - name: Build debug APK
        working-directory: app
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pilzkompass-android-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble offline web bundle
        working-directory: app
        run: |
          pip install requests pillow
          npm ci
          python ../tools/build-app.py
      - name: Build unsigned iOS app
        working-directory: app
        run: |
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          # Unsigned .ipa: sign it yourself (e.g. Sideloadly/AltStore with your Apple ID) to install.
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Pilzkompass-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: pilzkompass-ios-unsigned-ipa
          path: app/Pilzkompass-unsigned.ipa
          compression-level: 0

  # Tag v* (e.g. v0.1.0-alpha.1) → GitHub pre-release with both apps attached.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv pilzkompass-android-apk/app-debug.apk "Pilzkompass-$TAG.apk"
          mv pilzkompass-ios-unsigned-ipa/Pilzkompass-unsigned.ipa "Pilzkompass-$TAG-unsigned.ipa"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "Pilzkompass $TAG"             --notes-file - "Pilzkompass-$TAG.apk" "Pilzkompass-$TAG-unsigned.ipa" <<'NOTES'
          Erste Testversion (Alpha). Nicht für Essensentscheidungen verwenden — jeden Fund von Pilzsachverständigen prüfen lassen.

          **Android:** APK herunterladen und installieren („Unbekannte Apps installieren“ erlauben). Debug-signiert.
          **iOS:** unsignierte IPA — vor der Installation mit eigener Apple-ID signieren (z. B. Sideloadly oder AltStore).

          Enthält: 100 Röhrlinge (DE/EN) mit Fotos, Warnungen, Doppelgängern und ⭐ für Anfänger · KI-Fotobestimmung offline · Baumkarte Deutschland (10 m, offline) · Pilzwetter und Begrüßung mit Empfehlung (Internet nötig).
          NOTES
