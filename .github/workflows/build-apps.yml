name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Assemble offline web bundle
        working-directory: app
        run: |
          pip install requests pillow
          npm ci
          python ../tools/build-app.py
      - name: Build debug APK
        working-directory: app
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pilzkompass-android-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0

  # Google Play bundle (AAB), signed with the upload key; tiles in an install-time asset pack.
  # Kept as a short-lived workflow artifact only, not attached to the public release.
  play:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Assemble offline web bundle
        working-directory: app
        run: |
          pip install requests pillow
          npm ci
          python ../tools/build-app.py
      - name: Build signed Play bundle
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          export KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          bash ../tools/play-bundle.sh
          rm -f "$KEYSTORE_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: pilzkompass-play-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          compression-level: 0
          retention-days: 14

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble offline web bundle
        working-directory: app
        run: |
          pip install requests pillow
          npm ci
          python ../tools/build-app.py
      - name: Build unsigned iOS app
        working-directory: app
        run: |
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          # Unsigned .ipa: sign it yourself (e.g. Sideloadly/AltStore with your Apple ID) to install.
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Pilzkompass-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: pilzkompass-ios-unsigned-ipa
          path: app/Pilzkompass-unsigned.ipa
          compression-level: 0

  # Tag v* (e.g. v0.1.0-alpha.1) → GitHub pre-release with both apps attached.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in *beta*) STAGE=Beta ;; *rc*) STAGE=Release-Kandidat ;; *) STAGE=Alpha ;; esac
          mv pilzkompass-android-apk/app-debug.apk "Pilzkompass-$TAG.apk"
          mv pilzkompass-ios-unsigned-ipa/Pilzkompass-unsigned.ipa "Pilzkompass-$TAG-unsigned.ipa"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "Pilzkompass $TAG"             --notes-file - "Pilzkompass-$TAG.apk" "Pilzkompass-$TAG-unsigned.ipa" <<NOTES
          Testversion ($STAGE). Nicht für Essensentscheidungen verwenden — jeden Fund von Pilzsachverständigen prüfen lassen.

          **Android:** APK herunterladen und installieren („Unbekannte Apps installieren“ erlauben). Debug-signiert.
          **iOS:** unsignierte IPA — vor der Installation mit eigener Apple-ID signieren (z. B. Sideloadly oder AltStore).

          Enthält: 100 Röhrlinge (DE/EN) mit Fotos, Warnungen, Doppelgängern und ⭐ für Anfänger · KI-Fotobestimmung offline mit drei Ansichten · Pilzkarte Deutschland (10 m, offline) · Pilzwetter und Begrüßung mit Empfehlung (Internet nötig).
          NOTES
