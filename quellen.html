<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Pilzkompass — Quellen und Lizenzen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110d; --surface: #1f1a14; --surface-2: #2a231b; --line: #3a3127;
    --text: #efe6d8; --muted: #a99a85; --caution: #e0a83a;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px 48px; }
  header { position: relative; padding: 40px 0 8px; }
  .back { color: var(--muted); font-size: 13px; text-decoration: none; }
  .back:hover { color: var(--text); }
  h1 { font: 900 clamp(32px, 6vw, 52px)/1.05 Fraunces, Georgia, serif; margin: 10px 0 10px; letter-spacing: -0.02em; }
  h1 span { color: var(--caution); }
  h2 { font: 700 22px Fraunces, Georgia, serif; margin: 32px 0 10px; }
  h3 { font: italic 700 16px Fraunces, Georgia, serif; margin: 18px 0 6px; }
  .lede, .note { color: var(--muted); margin: 0 0 10px; }
  .lang { position: absolute; top: 20px; right: 0; display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .lang button { background: var(--surface); color: var(--muted); border: 0; padding: 6px 14px; font: 700 12px Inter, sans-serif; letter-spacing: .06em; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .src { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .src li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; font-size: 14px; }
  .src b { display: block; }
  .src span { color: var(--muted); }
  .photos { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .photos li { display: flex; gap: 10px; align-items: center; font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
  .photos img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; background: var(--surface-2); flex: none; }
  .photos div { min-width: 0; }
  .photos .file { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #filter { width: 100%; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; font: inherit; margin: 6px 0 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="lang" role="group" aria-label="Language / Sprache">
      <button data-lang="de">DE</button><button data-lang="en">EN</button>
    </div>
    <a class="back" href="index.html" data-i18n="back"></a>
    <h1 data-i18n="title"></h1>
    <p class="lede" data-i18n="lede"></p>
  </header>

  <h2 data-i18n="dataHead"></h2>
  <ul class="src" id="data"></ul>

  <h2 data-i18n="aiHead"></h2>
  <p class="note" data-i18n="aiText"></p>

  <h2 data-i18n="swHead"></h2>
  <ul class="src" id="software"></ul>

  <h2 data-i18n="photoHead"></h2>
  <p class="note" data-i18n="photoText"></p>
  <input id="filter" type="search" autocomplete="off">
  <div id="photos"></div>
</div>

<script src="data.js"></script>
<script>
  const T = {
    de: {
      back: '← Alle Röhrlinge',
      title: 'Quellen und <span>Lizenzen</span>',
      lede: 'Der Pilzkompass steht auf den Schultern vieler Fotografinnen, Fotografen und offener Datenquellen. Hier sind alle aufgeführt.',
      dataHead: 'Karten und Daten',
      aiHead: 'KI-Bestimmung',
      aiText: 'Grundmodell: DINOv2 ViT-S/14 von Meta AI (Apache 2.0). Feinjustiert auf rund 40.000 Fotos von iNaturalist (research grade); die Fotos wurden nur zum Training ausgewertet und sind nicht in der App enthalten. Die vollständige Liste der Urheberinnen und Urheber steht in <a href="model/photo-credits.csv">photo-credits.csv</a>.',
      swHead: 'Software und Schriften',
      photoHead: 'Fotos',
      photoText: n => `${n} Fotos von Wikimedia Commons, für die App verkleinert und zugeschnitten, sonst unverändert. Jedes Foto ist mit seiner Dateiseite verlinkt, wo die vollständigen Angaben stehen. Fotos unter CC BY-SA dürfen nur unter derselben Lizenz weitergegeben werden.`,
      filter: 'Art oder Urheber suchen…',
      unknown: 'Urheber siehe Dateiseite',
      pd: 'Gemeinfrei',
    },
    en: {
      back: '← All boletes',
      title: 'Sources and <span>licences</span>',
      lede: 'Pilzkompass stands on the shoulders of many photographers and open data sources. All of them are listed here.',
      dataHead: 'Maps and data',
      aiHead: 'AI identification',
      aiText: 'Base model: DINOv2 ViT-S/14 by Meta AI (Apache 2.0). Fine-tuned on about 40,000 research-grade iNaturalist photos; the photos were only analysed for training and are not included in the app. The full list of photographers is in <a href="model/photo-credits.csv">photo-credits.csv</a>.',
      swHead: 'Software and fonts',
      photoHead: 'Photos',
      photoText: n => `${n} photos from Wikimedia Commons, scaled down and cropped for the app, otherwise unchanged. Each photo links to its file page with the full details. Photos under CC BY-SA may only be passed on under the same licence.`,
      filter: 'Search species or author…',
      unknown: 'Author: see file page',
      pd: 'Public domain',
    },
  };
  const DATA = [
    ['Thünen-Institut', { de: 'Dominante Baumarten in Deutschland 2017/2018 (Blickensdörfer et al. 2022), 10 m — Grundlage der Pilzkarte. CC BY 4.0.', en: 'Dominant tree species for Germany 2017/2018 (Blickensdörfer et al. 2022), 10 m — basis of the mushroom map. CC BY 4.0.' }, 'https://doi.org/10.3220/DATA20221214084846'],
    ['basemap.de — BKG', { de: 'Grundkarte der Pilzkarte. © GeoBasis-DE / BKG, CC BY 4.0.', en: 'Base map of the mushroom map. © GeoBasis-DE / BKG, CC BY 4.0.' }, 'https://basemap.de'],
    ['Deutscher Wetterdienst (DWD)', { de: 'Wetterbeobachtungen und MOSMIX-Vorhersage für das Pilzwetter, abgerufen über Bright Sky (brightsky.dev). Quelle: Deutscher Wetterdienst.', en: 'Weather observations and MOSMIX forecast for the mushroom weather, retrieved via Bright Sky (brightsky.dev). Source: Deutscher Wetterdienst.' }, 'https://www.dwd.de/opendata'],
    ['OpenStreetMap / Nominatim', { de: 'Ortssuche. © OpenStreetMap-Mitwirkende, ODbL.', en: 'Place search. © OpenStreetMap contributors, ODbL.' }, 'https://www.openstreetmap.org/copyright'],
    ['GBIF', { de: 'Fundmeldungen je Monat für Saisonkalender und Beliebtheit (GBIF.org, Occurrence-Daten, CC0 / CC BY).', en: 'Monthly occurrence records for the season calendar and popularity (GBIF.org occurrence data, CC0 / CC BY).' }, 'https://www.gbif.org'],
    ['Wikipedia / Wikimedia Commons', { de: 'Fotos (siehe unten) und Leitbilder der Arten.', en: 'Photos (see below) and lead images of the species.' }, 'https://commons.wikimedia.org'],
  ];
  const SOFTWARE = [
    ['DINOv2', 'Meta AI', 'Apache 2.0', 'https://github.com/facebookresearch/dinov2'],
    ['ONNX Runtime Web', 'Microsoft', 'MIT', 'https://github.com/microsoft/onnxruntime'],
    ['Leaflet', 'Volodymyr Agafonkin', 'BSD-2-Clause', 'https://leafletjs.com'],
    ['Capacitor', 'Ionic', 'MIT', 'https://capacitorjs.com'],
    ['Fraunces', 'Undercase Type', 'SIL Open Font License 1.1', 'https://github.com/undercasetype/Fraunces'],
    ['Inter', 'Rasmus Andersson', 'SIL Open Font License 1.1', 'https://rsms.me/inter/'],
  ];
  // Licence name as Commons gives it → deed URL.
  function licenceUrl(l) {
    if (/^CC0/i.test(l)) return 'https://creativecommons.org/publicdomain/zero/1.0/';
    const m = l.match(/^CC (BY(?:-SA)?) ([\d.]+)(?: (\w\w))?/i);
    return m ? `https://creativecommons.org/licenses/${m[1].toLowerCase()}/${m[2]}/${m[3] ? m[3].toLowerCase() + '/' : ''}` : null;
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const fileUrl = f => `https://commons.wikimedia.org/wiki/File:${encodeURIComponent(f.replace(/ /g, '_'))}`;
  const store = {
    get() { try { return localStorage.getItem('lang'); } catch { return null; } },
    set(v) { try { localStorage.setItem('lang', v); } catch {} },
  };
  let lang = store.get() || ((navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'en');
  const total = BOLETES.reduce((n, s) => n + (s.photos?.length ?? 0), 0);

  function renderPhotos() {
    const t = T[lang], q = document.getElementById('filter').value.trim().toLowerCase();
    document.getElementById('photos').innerHTML = BOLETES.map(s => {
      const names = [s.sci, s.de, s.en].join(' ').toLowerCase();
      const ph = (s.photos ?? []).filter(p => !q || names.includes(q) || (p.artist ?? '').toLowerCase().includes(q));
      if (!ph.length) return '';
      return `<h3>${esc(s.sci)}</h3><ul class="photos">${ph.map(p => {
        const url = licenceUrl(p.license);
        const lic = /public domain/i.test(p.license) ? t.pd : esc(p.license);
        return `<li><img src="${esc(p.thumb)}" alt="" loading="lazy"><div>
          ${p.artist ? esc(p.artist) : t.unknown} · ${url ? `<a href="${url}" target="_blank" rel="noopener">${lic}</a>` : lic}
          <a class="file" href="${fileUrl(p.file)}" target="_blank" rel="noopener">${esc(p.file)}</a></div></li>`;
      }).join('')}</ul>`;
    }).join('');
  }

  function setLang(l) {
    lang = l;
    store.set(l);
    const t = T[l];
    document.documentElement.lang = l;
    document.title = 'Pilzkompass — ' + (l === 'de' ? 'Quellen und Lizenzen' : 'Sources and licences');
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const v = t[el.dataset.i18n];
      el.innerHTML = typeof v === 'function' ? v(total) : v;
    });
    document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === l));
    document.getElementById('filter').placeholder = t.filter;
    document.getElementById('data').innerHTML = DATA.map(([name, text, url]) =>
      `<li><b><a href="${url}" target="_blank" rel="noopener">${esc(name)}</a></b><span>${esc(text[l])}</span></li>`).join('');
    document.getElementById('software').innerHTML = SOFTWARE.map(([name, by, lic, url]) =>
      `<li><b><a href="${url}" target="_blank" rel="noopener">${esc(name)}</a></b><span>${esc(by)} · ${esc(lic)}</span></li>`).join('');
    renderPhotos();
  }

  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  document.getElementById('filter').addEventListener('input', renderPhotos);
  setLang(lang);
</script>
<script src="nav.js"></script>
</body>
</html>
