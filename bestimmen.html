<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Pilzkompass — Bestimmungshilfe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110d; --surface: #1f1a14; --surface-2: #2a231b; --line: #3a3127;
    --text: #efe6d8; --muted: #a99a85;
    --edible: #6fae5a; --caution: #e0a83a; --bitter: #d9771f; --poison: #e5322d;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
  header { position: relative; padding: 40px 0 16px; }
  .back { color: var(--muted); font-size: 13px; text-decoration: none; }
  .back:hover { color: var(--text); }
  h1 { font: 900 clamp(34px, 6vw, 56px)/1.05 Fraunces, Georgia, serif; margin: 10px 0 10px; letter-spacing: -0.02em; }
  h1 span { color: var(--caution); }
  .lede { color: var(--muted); margin: 0; }
  .lang { position: absolute; top: 20px; right: 0; display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .lang button { background: var(--surface); color: var(--muted); border: 0; padding: 6px 14px; font: 700 12px Inter, sans-serif; letter-spacing: .06em; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--text); color: var(--bg); }

  .box { border-radius: var(--radius); padding: 14px 18px; font-size: 14px; margin: 16px 0; }
  .box.danger { border: 2px solid var(--poison); background: rgba(229, 50, 45, .08); }
  .box.danger strong { color: var(--poison); }
  .box.note { border: 1px solid var(--line); background: var(--surface); color: var(--muted); }

  .drop {
    display: grid; place-items: center; text-align: center; gap: 10px;
    border: 2px dashed var(--line); border-radius: var(--radius); background: var(--surface);
    padding: 36px 16px; margin: 20px 0;
  }
  .drop:hover, .drop.over { border-color: var(--caution); }
  .drop .big { font: 700 20px Fraunces, Georgia, serif; }
  .drop .small { color: var(--muted); font-size: 13px; }
  .drop input { display: none; }
  .btn { background: var(--caution); color: #14110d; border: 0; border-radius: 999px; padding: 10px 20px; font: 700 14px Inter, sans-serif; cursor: pointer; }
  .btn.alt { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .views { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .views figure { margin: 0; width: 88px; font-size: 12px; color: var(--muted); }
  .views svg { width: 64px; height: 64px; display: block; margin: 0 auto 4px; }

  .result { display: grid; grid-template-columns: minmax(0, 260px) 1fr; gap: 20px; align-items: start; }
  @media (max-width: 640px) { .result { grid-template-columns: 1fr; } }
  .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .shots figure { margin: 0; font-size: 11px; color: var(--muted); line-height: 1.3; }
  .shots img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; display: block; margin-bottom: 3px; }
  .shots .pz { color: var(--poison); font-weight: 700; }

  /* Guided camera: three views, each with a see-through mushroom outline to line the find up with. */
  #cam { position: fixed; inset: 0; z-index: 50; background: #000; overflow: hidden; touch-action: none; }
  #cam[hidden] { display: none; }
  #cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #cam .frame { position: absolute; left: 50%; top: 46%; width: min(86vw, 58vh); aspect-ratio: 1; transform: translate(-50%, -50%);
    border: 2px solid rgba(255, 255, 255, .55); border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(10, 8, 6, .5); }
  #cam .guide svg { width: 100%; height: 100%; display: block; opacity: .6; }
  #cam .nocam { position: absolute; left: 0; right: 0; top: 46%; transform: translateY(calc(min(43vw, 29vh) + 14px)); text-align: center; color: var(--muted); font-size: 13px; padding: 0 24px; }
  .camtop { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px; padding: max(14px, env(safe-area-inset-top)) 14px 10px; background: linear-gradient(rgba(0,0,0,.7), transparent); }
  .camtop .x { background: rgba(0,0,0,.4); color: #fff; border: 1px solid rgba(255,255,255,.3); width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer; flex: none; }
  .steps { display: flex; gap: 8px; margin-left: auto; }
  .steps button { width: 52px; height: 52px; padding: 0; border-radius: 10px; border: 2px solid rgba(255,255,255,.25); background: rgba(0,0,0,.45); overflow: hidden; cursor: pointer; position: relative; }
  .steps button.cur { border-color: var(--caution); }
  .steps button.ok::after { content: '✓'; position: absolute; right: 2px; bottom: 0; color: #fff; font: 800 13px Inter, sans-serif; text-shadow: 0 0 3px #000; }
  .steps img, .steps svg { width: 100%; height: 100%; object-fit: cover; display: block; }
  .camtip { position: absolute; left: 0; right: 0; bottom: calc(max(20px, env(safe-area-inset-bottom)) + 96px); text-align: center; padding: 0 20px; color: #fff; text-shadow: 0 1px 4px #000; }
  .camtip b { display: block; font: 700 22px Fraunces, Georgia, serif; }
  .camtip small { display: block; color: var(--caution); font: 700 11px Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
  .camtip span { font-size: 14px; }
  .cambar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-around; padding: 14px 20px max(20px, env(safe-area-inset-bottom)); }
  .cambar .side { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.3); color: #fff; font-size: 20px; cursor: pointer; }
  .cambar .side input { display: none; }
  .shutter { width: 74px; height: 74px; border-radius: 50%; border: 5px solid #fff; background: var(--caution); cursor: pointer; box-shadow: 0 0 0 3px rgba(0,0,0,.35); }
  .shutter:active { transform: scale(.94); }
  .flash { animation: flash .25s; }
  @keyframes flash { from { background: #fff; } }
  .status { color: var(--muted); font-size: 14px; margin: 8px 0; }

  .pred { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; margin-bottom: 10px; }
  .pred.poisonous { border: 3px solid var(--poison); }
  .pred.bitter { border: 3px solid var(--bitter); }
  .pred .warn { color: #fff; font: 800 15px Inter, sans-serif; padding: 8px 12px; letter-spacing: .02em; }
  .pred .warn.poisonous { background: repeating-linear-gradient(-45deg, #c4211d 0 14px, #a81a17 14px 28px); }
  .pred .warn.protected { background: repeating-linear-gradient(-45deg, #2f6fb8 0 14px, #275e9e 14px 28px); }
  .pred .prot { font-size: 12px; color: #9cc3ef; margin-top: 3px; }
  .pred .warn.bitter { background: repeating-linear-gradient(-45deg, #c0631a 0 14px, #a65414 14px 28px); }
  .pred .row { display: flex; gap: 12px; padding: 10px 12px; align-items: center; }
  .pred img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; flex: none; background: var(--surface-2); }
  .pred .ph { width: 64px; height: 64px; border-radius: 6px; flex: none; background: var(--surface-2); }
  .pred .info { flex: 1; min-width: 0; }
  .pred .sci { font: italic 700 17px/1.2 Fraunces, Georgia, serif; }
  .pred .names { color: var(--muted); font-size: 13px; }
  .pred .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
  .bar { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--text); }
  .pct { font: 700 14px Inter, sans-serif; min-width: 48px; text-align: right; }
  .badge { padding: 2px 8px; border-radius: 999px; font: 700 10px Inter, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: #14110d; }
  .badge.edible { background: var(--edible); } .badge.caution { background: var(--caution); }
  .badge.bitter { background: var(--bitter); } .badge.poisonous { background: var(--poison); color: #fff; }
  .badge.inedible, .badge.other { background: var(--muted); }
  .names a { color: inherit; }
  .link { font-size: 12px; color: var(--muted); }

  footer { color: var(--muted); font-size: 12px; padding: 32px 0 48px; border-top: 1px solid var(--line); margin-top: 32px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="lang" role="group" aria-label="Language / Sprache">
      <button data-lang="de">DE</button><button data-lang="en">EN</button>
    </div>
    <a class="back" href="index.html" data-i18n="back"></a>
    <h1 data-i18n="title"></h1>
    <p class="lede" data-i18n="lede"></p>
  </header>

  <div class="box danger" data-i18n="danger"></div>

  <div class="drop" id="drop">
    <span class="big" data-i18n="pick"></span>
    <div class="views" id="views"></div>
    <div class="btns"><button class="btn" id="start" data-i18n="cameraBtn"></button></div>
    <span class="small" data-i18n="pickHint"></span>
  </div>

  <section id="out" hidden>
    <div class="result">
      <div>
        <div class="shots" id="shots"></div>
        <p class="status" id="status"></p>
      </div>
      <div id="preds"></div>
    </div>
    <div id="extra"></div>
  </section>

  <footer data-i18n="footer"></footer>
</div>

<div id="cam" hidden>
  <video id="video" playsinline muted autoplay></video>
  <div class="frame"><div class="guide" id="guide"></div></div>
  <div class="nocam" id="nocam" hidden></div>
  <div class="camtop"><button class="x" id="camClose" aria-label="Close">✕</button><div class="steps" id="steps"></div></div>
  <div class="camtip"><small id="stepNo"></small><b id="stepTitle"></b><span id="stepHint"></span></div>
  <div class="cambar">
    <label class="side" id="galleryBtn"><input type="file" accept="image/*" id="camPick"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg></label>
    <button class="shutter" id="shutter" aria-label="Foto"></button>
    <label class="side" style="visibility:hidden"></label>
  </div>
  <input type="file" accept="image/*" capture="environment" id="camNative" hidden>
</div>

<script src="data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
<script>
  const T = {
    de: {
      back: '← Alle Röhrlinge',
      title: 'Bestimmungs<span>hilfe</span>',
      lede: 'Den Pilz aus drei Blickwinkeln fotografieren. Eine KI schlägt die wahrscheinlichsten Arten vor — als erste Eingrenzung.',
      danger: '<strong>Nur zur ersten Eingrenzung — niemals zur Essbarkeits-Entscheidung.</strong> Die KI verwechselt Doppelgänger (z. B. Steinpilz und Gallen-Röhrling, die giftigen Rotporer untereinander). Jeden Fund von Pilzsachverständigen (DGfM) prüfen lassen.',
      pick: 'Drei Fotos, drei Ansichten',
      cameraBtn: '📷 Pilz fotografieren',
      pickHint: 'Die Kamera blendet für jede Ansicht eine Schablone ein. Scharf und gut beleuchtet; die Fotos bleiben auf deinem Gerät.',
      views: [
        ['Von der Seite', 'Ganzer Pilz mit Stiel und Stielbasis — vorsichtig herausdrehen, nicht abschneiden.'],
        ['Schräg von oben (45°)', 'Kamera etwa 45° über dem Pilz: Hutoberseite und Stiel zugleich sichtbar.'],
        ['Schräg von unten (45°)', 'Kamera etwa 45° unter dem Hut: Poren bzw. Röhren und Stiel zugleich scharf zeigen.'],
      ],
      stepNo: (i, n) => `Ansicht ${i} von ${n}`,
      nocam: 'Live-Kamera nicht verfügbar — der Auslöser öffnet die Kamera-App, der linke Knopf die Galerie.',
      view: i => ['Seite', '45°', 'Unten'][i],
      disagree: '<strong>Die drei Ansichten passen nicht zur selben Art.</strong> Das Ergebnis ist unsicher; Fotos schärfer oder näher wiederholen.',
      viewPoison: v => `<strong>Ansicht „${v}“ sieht nach einer giftigen Art aus.</strong> Behandle den Fund als giftig, bis Pilzsachverständige etwas anderes sagen.`,
      loading: 'KI wird geladen (einmalig ca. 25 MB)…',
      running: 'Analysiere…',
      done: ms => `Fertig in ${ms} ms — läuft komplett auf diesem Gerät.`,
      failed: 'Die KI konnte nicht geladen werden. Bitte Internetverbindung prüfen und neu laden.',
      toCard: 'Zur Art →', starTip: 'Anfängerfreundlich: schmeckt gut, kein giftiger oder ungenießbarer Doppelgänger',
      low: '<strong>Unsicheres Ergebnis.</strong> Der beste Vorschlag liegt unter 50 %. Fotos wiederholen: schärfer, näher, besser beleuchtet.',
      poisonSum: p => `<strong>Zusammen ${p} % Wahrscheinlichkeit für eine giftige Art</strong> unter den Vorschlägen. Behandle den Fund als giftig, bis Pilzsachverständige etwas anderes sagen.`,
      groups: {
        'rare-poisonous': ['Seltene giftige Röhrlinge', 'Eine der seltenen giftigen Arten:'],
        'rare-other': ['Seltene Röhrlinge', 'Eine der seltenen Arten:'],
        'other-fungi': ['Anderer Pilz — kein Röhrling', 'Die KI hält das Foto für einen Pilz außerhalb der Röhrlinge.'],
      },
      look: 'Doppelgänger, kein Röhrling',
      status: { poisonous: 'Giftig', deadly: 'Tödlich giftig', bitter: 'Ungenießbar', caution: 'Nur gut durchgegart essbar', edible: 'Essbar', inedible: 'Kein Speisepilz', other: 'Unbekannt' },
      warn: { poisonous: '☠ GIFTIG', deadly: '☠ TÖDLICH GIFTIG', bitter: '✖ SCHMECKT ÜBEL' },
      protect: { strict: '🛡 GESCHÜTZT — NICHT SAMMELN', personal: '🛡 Geschützt: nur geringe Mengen für den Eigenbedarf' },
      footer: 'KI-Modell: DINOv2 ViT-S/14 (Meta AI, Apache 2.0), feinjustiert für den Pilzkompass auf rund 40.000 Fotos von iNaturalist (research grade). Die Fotos stehen unter Creative-Commons-Lizenzen ihrer Urheber, teils nicht-kommerziell; die vollständige Urheberliste steht in <a href="model/photo-credits.csv">photo-credits.csv</a>. Nur für nicht-kommerzielle Nutzung. Das Modell läuft im Browser über ONNX Runtime Web; Fotos werden nicht hochgeladen.',
    },
    en: {
      back: '← All boletes',
      title: 'Identification <span>aid</span>',
      lede: 'Photograph the mushroom from three angles. An AI suggests the most likely species, as a first narrowing-down.',
      danger: '<strong>Only for a first narrowing-down — never for deciding edibility.</strong> The AI confuses look-alikes (e.g. cep and bitter bolete, or the poisonous red-pored boletes with each other). Have every find checked by a mushroom expert (DGfM).',
      pick: 'Three photos, three views',
      cameraBtn: '📷 Photograph mushroom',
      pickHint: 'The camera shows a template for each view. Sharp and well lit; the photos stay on your device.',
      views: [
        ['From the side', 'Whole mushroom with stem and stem base — twist it out gently, do not cut it.'],
        ['From above at 45°', 'Camera about 45° above the mushroom: cap top and stem visible at once.'],
        ['From below at 45°', 'Camera about 45° below the cap: show pores or tubes and the stem sharply at once.'],
      ],
      stepNo: (i, n) => `View ${i} of ${n}`,
      nocam: 'Live camera not available — the shutter opens the camera app, the left button the gallery.',
      view: i => ['Side', '45°', 'Under'][i],
      disagree: '<strong>The three views do not point to the same species.</strong> The result is uncertain; retake sharper or closer photos.',
      viewPoison: v => `<strong>The “${v}” view looks like a poisonous species.</strong> Treat the find as poisonous until a mushroom expert says otherwise.`,
      loading: 'Loading AI (one-time, about 25 MB)…',
      running: 'Analysing…',
      done: ms => `Done in ${ms} ms — runs entirely on this device.`,
      failed: 'The AI could not be loaded. Please check your connection and reload.',
      toCard: 'Go to species →', starTip: 'Beginner-friendly: tastes good, no poisonous or inedible look-alike',
      low: '<strong>Uncertain result.</strong> The best suggestion is below 50%. Retake the photos: sharper, closer, better lit.',
      poisonSum: p => `<strong>Together ${p}% probability of a poisonous species</strong> among the suggestions. Treat the find as poisonous until a mushroom expert says otherwise.`,
      groups: {
        'rare-poisonous': ['Rare poisonous boletes', 'One of the rare poisonous species:'],
        'rare-other': ['Rare boletes', 'One of the rare species:'],
        'other-fungi': ['Other fungus — not a bolete', 'The AI thinks this is a fungus outside the boletes.'],
      },
      look: 'Look-alike, not a bolete',
      status: { poisonous: 'Poisonous', deadly: 'Deadly poisonous', bitter: 'Tastes bad', caution: 'Edible only well cooked', edible: 'Edible', inedible: 'Not edible', other: 'Unknown' },
      warn: { poisonous: '☠ POISONOUS', deadly: '☠ DEADLY POISONOUS', bitter: '✖ TASTES TERRIBLE' },
      protect: { strict: '🛡 PROTECTED — DO NOT PICK', personal: '🛡 Protected: small amounts for own use only' },
      footer: 'AI model: DINOv2 ViT-S/14 (Meta AI, Apache 2.0), fine-tuned for Pilzkompass on about 40,000 research-grade iNaturalist photos. The photos are under their authors\' Creative Commons licences, some non-commercial; the full credit list is in <a href="model/photo-credits.csv">photo-credits.csv</a>. Non-commercial use only. The model runs in the browser via ONNX Runtime Web; photos are not uploaded.',
    },
  };
  // Non-bolete look-alikes the model knows.
  const LOOKALIKES = {
    'Paxillus involutus': { de: 'Kahler Krempling', en: 'Brown roll-rim', status: 'deadly' },
    'Scleroderma citrinum': { de: 'Dickschaliger Kartoffelbovist', en: 'Common earthball', status: 'poisonous' },
    'Scleroderma areolatum': { de: 'Leopardfleckiger Kartoffelbovist', en: 'Leopard earthball', status: 'poisonous' },
    'Hygrophoropsis aurantiaca': { de: 'Falscher Pfifferling', en: 'False chanterelle', status: 'inedible' },
    'Amanita phalloides': { de: 'Grüner Knollenblätterpilz', en: 'Death cap', status: 'deadly' },
    'Amanita muscaria': { de: 'Fliegenpilz', en: 'Fly agaric', status: 'poisonous' },
    'Amanita pantherina': { de: 'Pantherpilz', en: 'Panther cap', status: 'poisonous' },
    'Amanita rubescens': { de: 'Perlpilz', en: 'Blusher', status: 'caution' },
    'Fistulina hepatica': { de: 'Leberreischling', en: 'Beefsteak fungus', status: 'edible' },
    'Russula ochroleuca': { de: 'Ocker-Täubling', en: 'Ochre brittlegill', status: 'inedible' },
    'Lactarius deliciosus': { de: 'Edel-Reizker', en: 'Saffron milkcap', status: 'edible' },
    'Cantharellus cibarius': { de: 'Echter Pfifferling', en: 'Chanterelle', status: 'edible', protection: 'personal' },
  };
  const POISON = new Set(['poisonous', 'deadly']);
  const SIZE = 224, MEAN = [0.485, 0.456, 0.406], STD = [0.229, 0.224, 0.225];

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const store = {
    get() { try { return localStorage.getItem('lang'); } catch { return null; } },
    set(v) { try { localStorage.setItem('lang', v); } catch {} },
  };
  let lang = store.get() || ((navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'en');
  const bySci = new Map(BOLETES.map(s => [s.sci, s]));
  let session, classes, last = null;

  async function load() {
    if (session) return;
    // Absolute URL: ONNX Runtime resolves relative paths against its own script, not the page.
    ort.env.wasm.wasmPaths = new URL('https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/', location.href).href;
    [session, classes] = await Promise.all([
      ort.InferenceSession.create('model/boletus.onnx', { executionProviders: ['wasm'] }),
      fetch('model/boletus-classes.json').then(r => r.json()),
    ]);
  }

  // Same preprocessing as training evaluation: shorter side to 224, centre crop, ImageNet mean/std.
  // createImageBitmap with resizeQuality 'high' avoids the aliasing of a plain canvas downscale.
  async function toTensor(blob) {
    const full = await createImageBitmap(blob);
    const side = Math.min(full.width, full.height);
    const bmp = await createImageBitmap(full, (full.width - side) / 2, (full.height - side) / 2, side, side,
      { resizeWidth: SIZE, resizeHeight: SIZE, resizeQuality: 'high' });
    const c = document.createElement('canvas');
    c.width = c.height = SIZE;
    const ctx = c.getContext('2d');
    ctx.drawImage(bmp, 0, 0);
    const px = ctx.getImageData(0, 0, SIZE, SIZE).data;
    const data = new Float32Array(3 * SIZE * SIZE);
    for (let i = 0; i < SIZE * SIZE; i++)
      for (let ch = 0; ch < 3; ch++)
        data[ch * SIZE * SIZE + i] = (px[i * 4 + ch] / 255 - MEAN[ch]) / STD[ch];
    return new ort.Tensor('float32', data, [1, 3, SIZE, SIZE]);
  }

  function softmax(logits) {
    const max = Math.max(...logits);
    const exp = Array.from(logits, v => Math.exp(v - max));
    const sum = exp.reduce((a, b) => a + b, 0);
    return exp.map(v => v / sum);
  }

  // Runs the model on each view and averages the probabilities.
  async function analyse(blobs) {
    const t = T[lang];
    const out = document.getElementById('out');
    const status = document.getElementById('status');
    out.hidden = false;
    last = null;
    document.getElementById('preds').innerHTML = '';
    document.getElementById('extra').innerHTML = '';
    urls.forEach(u => URL.revokeObjectURL(u));
    urls = blobs.map(b => URL.createObjectURL(b));
    renderShots(null);
    out.scrollIntoView({ behavior: 'smooth', block: 'start' });
    try {
      status.textContent = t.loading;
      await load();
      status.textContent = t.running;
      const t0 = performance.now();
      const views = [];
      for (const b of blobs) views.push(softmax((await session.run({ image: await toTensor(b) })).logits.data));
      const probs = views[0].map((_, i) => views.reduce((s, v) => s + v[i], 0) / views.length);
      const isPoison = i => POISON.has(describe(classes[i]).status);
      last = {
        results: probs.map((p, i) => ({ i, p })).sort((a, b) => b.p - a.p).slice(0, 5),
        poison: probs.reduce((sum, p, i) => sum + (isPoison(i) ? p : 0), 0),
        views: views.map(v => { const i = v.indexOf(Math.max(...v)); return { i, p: v[i], poison: isPoison(i) }; }),
        ms: Math.round(performance.now() - t0),
      };
      showResults();
    } catch (err) {
      console.error(err);
      status.textContent = t.failed;
    }
  }

  // The three photos, each with its own best guess underneath.
  function renderShots(views) {
    const t = T[lang];
    document.getElementById('shots').innerHTML = urls.map((u, k) => {
      const v = views?.[k], d = v && describe(classes[v.i]);
      return `<figure><img src="${u}" alt=""><b>${t.view(k)}</b>${d ? `<br><span class="${v.poison ? 'pz' : ''}">${d.plain ? esc(d.sci) : `<i>${esc(d.sci)}</i>`} ${Math.round(v.p * 100)} %</span>` : ''}</figure>`;
    }).join('');
  }

  // Turns a model class into what the page shows: name, names line, status, species card, etc.
  function describe(c) {
    const t = T[lang];
    if (c.kind === 'species') {
      const s = bySci.get(c.site[0]);
      const also = c.site.slice(1).map(n => `<i>${esc(n)}</i>`).join(', ');
      return { s, sci: s.sci, status: s.status, protection: s.protection,
        names: (lang === 'de' ? [s.de, s.en] : [s.en, s.de]).filter(n => n !== '—').map(esc).join(' · ') + (also ? ` · = ${also}` : ''),
        thumb: s.photos?.[0]?.thumb };
    }
    if (c.kind === 'lookalike') {
      const l = LOOKALIKES[c.key] ?? {};
      return { sci: c.key, status: l.status ?? 'other', protection: l.protection,
        names: `${esc(lang === 'de' ? l.de : l.en)} · ${t.look}` };
    }
    const [title, intro] = t.groups[c.key];
    const members = c.site.map(n => `<a href="index.html#${encodeURIComponent(n)}"><i>${esc(n)}</i></a>`).join(', ');
    return { sci: title, plain: true, status: c.key === 'rare-poisonous' ? 'poisonous' : 'other',
      names: members ? `${intro} ${members}` : intro };
  }

  function showResults() {
    if (!last) return;
    const t = T[lang];
    document.getElementById('status').textContent = t.done(last.ms);
    renderShots(last.views);
    document.getElementById('preds').innerHTML = last.results.map(({ i, p }) => {
      const d = describe(classes[i]);
      const st = d.status;
      return `<div class="pred ${POISON.has(st) ? 'poisonous' : st}">
        ${t.warn[st] ? `<div class="warn ${POISON.has(st) ? 'poisonous' : st}">${t.warn[st]}</div>` : ''}
        ${d.protection === 'strict' ? `<div class="warn protected">${t.protect.strict}</div>` : ''}
        <div class="row">
          ${d.thumb ? `<img src="${esc(d.thumb)}" alt="">` : '<div class="ph"></div>'}
          <div class="info">
            <div class="sci"${d.plain ? ' style="font-style:normal"' : ''}>${esc(d.sci)}${d.s?.beginner ? ' <span title="${t.starTip}" style="font-style:normal">⭐</span>' : ''}</div>
            <div class="names">${d.names}</div>
            ${d.protection === 'personal' ? `<div class="prot">${t.protect.personal}</div>` : ''}
            <div class="meta"><span class="badge ${POISON.has(st) ? 'poisonous' : st}">${t.status[st]}</span>
              ${d.s ? `<a class="link" href="index.html#${encodeURIComponent(d.s.sci)}">${t.toCard}</a>` : ''}</div>
            <div class="bar"><i style="width:${(p * 100).toFixed(1)}%"></i></div>
          </div>
          <div class="pct">${(p * 100).toFixed(p < 0.1 ? 1 : 0)}%</div>
        </div>
      </div>`;
    }).join('');

    const extra = [];
    if (last.poison >= 0.1) extra.push(`<div class="box danger">${t.poisonSum(Math.round(last.poison * 100))}</div>`);
    else last.views.forEach((v, k) => { if (v.poison) extra.push(`<div class="box danger">${t.viewPoison(t.views[k][0])}</div>`); });
    if (new Set(last.views.map(v => v.i)).size > 1) extra.push(`<div class="box note">${t.disagree}</div>`);
    if (last.results[0].p < 0.5) extra.push(`<div class="box note">${t.low}</div>`);
    document.getElementById('extra').innerHTML = extra.join('');
  }

  function setLang(l) {
    lang = l;
    store.set(l);
    document.documentElement.lang = l;
    document.title = 'Pilzkompass — ' + (l === 'de' ? 'Bestimmungshilfe' : 'Identification aid');
    document.querySelectorAll('[data-i18n]').forEach(el => el.innerHTML = T[l][el.dataset.i18n]);
    document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === l));
    renderViews();
    if (!cam.hidden) renderCam();
    showResults();
  }

  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  // ---------- Guided camera: side, top, underside ----------
  // See-through outlines (viewBox 200×200) the user lines the mushroom up with.
  const dots = (() => {
    let d = '';
    for (let r = 26; r <= 68; r += 9)
      for (let n = Math.round(r / 3.2), k = 0; k < n; k++) {
        const a = (k + (r % 2) / 2) / n * 2 * Math.PI;
        const x = 100 + r * Math.cos(a), y = 96 + r * 0.42 * Math.sin(a);
        if (Math.abs(x - 100) < 20 && y > 92) continue;  // hidden behind the stem
        d += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2"/>`;
      }
    return d;
  })();
  const OUTLINES = [
    // side: domed cap over a thick, bulbous stem, on the ground
    `<path d="M28 96C28 46 68 24 100 24s72 22 72 72c-20 8-124 8-144 0Z"/>
     <path d="M40 99c30 12 90 12 120 0" stroke-dasharray="3 5"/>
     <path d="M80 104c-6 28-18 54-8 76 12 9 44 9 56 0 10-22-2-48-8-76"/>
     <path d="M30 186h140" stroke-dasharray="2 6" fill="none"/>`,
    // 45° from above: the cap top foreshortened to a wide oval, the stem below it, a ground ellipse
    `<path d="M24 86C24 50 60 26 100 26s76 24 76 60c0 24-34 38-76 38S24 110 24 86Z"/>
     <path d="M58 52c12-10 26-14 40-14" fill="none" stroke-dasharray="3 6"/>
     <path d="M80 122c-2 18-8 36-2 52 10 8 34 8 44 0 6-16 0-34-2-52"/>
     <ellipse cx="100" cy="176" rx="64" ry="12" fill="none" stroke-dasharray="2 6"/>`,
    // 45° from below: dome edge above, the foreshortened pore surface, the stem coming towards the camera
    `<path d="M24 96C24 58 60 32 100 32s76 26 76 64" fill="none"/>
     <ellipse cx="100" cy="96" rx="76" ry="32"/>
     <g fill="currentColor" stroke="none" opacity=".55">${dots}</g>
     <path d="M82 96c-2 28-6 56 0 82 10 8 30 8 40 0 6-26 2-54 0-82" fill="rgba(255,255,255,.12)"/>`,
  ];
  const outline = (k, color = '#fff') => `<svg viewBox="0 0 200 200" fill="rgba(255,255,255,.08)" stroke="currentColor" color="${color}"
    stroke-width="2.5" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${OUTLINES[k]}</svg>`;

  const cam = document.getElementById('cam'), video = document.getElementById('video');
  const shutter = document.getElementById('shutter'), camNative = document.getElementById('camNative');
  let stream = null, step = 0, shots = [null, null, null], urls = [], thumbs = [null, null, null];

  function renderViews() {
    document.getElementById('views').innerHTML = T[lang].views
      .map(([title], k) => `<figure>${outline(k, 'var(--caution)')}${title}</figure>`).join('');
  }

  function renderCam() {
    const t = T[lang];
    document.getElementById('guide').innerHTML = outline(step);
    document.getElementById('stepNo').textContent = t.stepNo(step + 1, 3);
    document.getElementById('stepTitle').textContent = t.views[step][0];
    document.getElementById('stepHint').textContent = t.views[step][1];
    document.getElementById('nocam').textContent = t.nocam;
    document.getElementById('steps').innerHTML = shots.map((s, k) =>
      `<button data-k="${k}" class="${k === step ? 'cur' : ''} ${s ? 'ok' : ''}" aria-label="${esc(t.views[k][0])}">${s ? `<img src="${thumbs[k]}" alt="">` : outline(k)}</button>`).join('');
  }

  async function openCam() {
    shots = [null, null, null];
    thumbs.forEach(u => u && URL.revokeObjectURL(u));
    thumbs = [null, null, null];
    step = 0;
    cam.hidden = false;
    document.body.style.overflow = 'hidden';
    history.pushState({ cam: true }, '');
    renderCam();
    load().catch(() => {});  // warm up the model while the user aims
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: false,
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1440 } } });
      if (cam.hidden) return stopStream();
      video.srcObject = stream;
      await video.play();
      document.getElementById('nocam').hidden = true;
      placeFrame();
    } catch (err) {
      console.warn('camera', err);
      stopStream();
      document.getElementById('nocam').hidden = false;
    }
  }

  function stopStream() {
    stream?.getTracks().forEach(tr => tr.stop());
    stream = null;
    video.srcObject = null;
    placeFrame();
  }

  function closeCam(fromHistory) {
    if (cam.hidden) return;
    stopStream();
    cam.hidden = true;
    document.body.style.overflow = '';
    if (!fromHistory && history.state?.cam) history.back();
  }

  // The frame marks the centre square of the picture: exactly the part the AI looks at.
  // The video keeps the camera's aspect ratio (object-fit: contain), so the square sits inside it.
  function placeFrame() {
    const fr = document.querySelector('#cam .frame');
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!stream || !vw) { fr.removeAttribute('style'); return; }
    const box = video.getBoundingClientRect();
    const scale = Math.min(box.width / vw, box.height / vh);
    const side = Math.min(vw, vh) * scale;
    Object.assign(fr.style, { width: side + 'px', left: box.left + box.width / 2 + 'px', top: box.top + box.height / 2 + 'px' });
  }
  addEventListener('resize', () => cam.hidden || placeFrame());
  video.addEventListener('resize', placeFrame);  // fires when the stream's size or orientation changes

  // Saves the full camera frame in its own aspect ratio (long edge at most 1600 px).
  function grab() {
    const vw = video.videoWidth, vh = video.videoHeight;
    const k = Math.min(1, 1600 / Math.max(vw, vh));
    const c = document.createElement('canvas');
    c.width = Math.round(vw * k); c.height = Math.round(vh * k);
    c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
    return new Promise(res => c.toBlob(res, 'image/jpeg', 0.9));
  }

  function take(blob) {
    if (!blob) return;
    shots[step] = blob;
    if (thumbs[step]) URL.revokeObjectURL(thumbs[step]);
    thumbs[step] = URL.createObjectURL(blob);
    const next = shots.findIndex(s => !s);
    if (next < 0) { closeCam(); analyse(shots); return; }
    step = next;
    renderCam();
  }

  shutter.addEventListener('click', async () => {
    if (!stream || !video.videoWidth) return camNative.click();
    cam.classList.remove('flash'); void cam.offsetWidth; cam.classList.add('flash');
    take(await grab());
  });
  [camNative, document.getElementById('camPick')].forEach(inp => inp.addEventListener('change', e => {
    if (e.target.files[0]) take(e.target.files[0]);
    e.target.value = '';  // allow picking the same photo again
  }));
  document.getElementById('steps').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) { step = +b.dataset.k; renderCam(); }  // tap a view to (re)take it
  });
  document.getElementById('camClose').addEventListener('click', () => closeCam());
  addEventListener('popstate', () => { if (!history.state?.cam) closeCam(true); });
  document.getElementById('start').addEventListener('click', openCam);

  // Desktop: dropping three photos works too (in the order side, top, underside).
  const drop = document.getElementById('drop');
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => {
    e.preventDefault(); drop.classList.remove('over');
    const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/')).slice(0, 3);
    if (files.length === 3) analyse(files);
    else if (files.length) { openCam(); files.forEach(take); }
  });
  setLang(lang);
</script>
</body>
</html>
