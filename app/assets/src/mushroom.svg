<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Flat mushroom: red cap with pale dots, cream stem, dark outline.
       Drawn inside the central ~60% so it survives Android's adaptive-icon mask. -->
  <defs>
    <clipPath id="capClip">
      <path d="M262 522C262 360 372 250 512 250s250 110 250 272c0 26-20 40-50 40H312c-30 0-50-14-50-40Z"/>
    </clipPath>
  </defs>
  <g stroke="#2b1a16" stroke-width="28" stroke-linejoin="round" stroke-linecap="round">
    <!-- stem, flaring at the foot -->
    <path d="M432 556c-4 76-16 138-44 198-10 24 6 42 30 42h188c24 0 40-18 30-42-28-60-40-122-44-198Z" fill="#f4e7cc"/>
    <!-- cap -->
    <path d="M262 522C262 360 372 250 512 250s250 110 250 272c0 26-20 40-50 40H312c-30 0-50-14-50-40Z" fill="#e8463d"/>
  </g>
  <!-- shade under the cap on the stem -->
  <path d="M446 578h132c2 26 4 48 8 66-46 14-102 14-148 0 4-18 6-40 8-66Z" fill="#e2cfa8"/>
  <g clip-path="url(#capClip)">
    <!-- lighter top-left, darker rim for a little volume -->
    <path d="M300 440C320 340 410 282 512 282c60 0 112 20 150 56-40-20-86-30-136-30-110 0-192 54-226 132Z" fill="#f2695f"/>
    <path d="M250 520h524v60H250Z" fill="#c9352d"/>
    <!-- dots -->
    <g fill="#fbd6d1">
      <ellipse cx="404" cy="384" rx="50" ry="44"/>
      <ellipse cx="560" cy="318" rx="40" ry="32"/>
      <ellipse cx="652" cy="430" rx="46" ry="42"/>
      <ellipse cx="510" cy="470" rx="32" ry="28"/>
      <ellipse cx="322" cy="490" rx="26" ry="24"/>
      <ellipse cx="732" cy="506" rx="20" ry="18"/>
      <ellipse cx="470" cy="292" rx="18" ry="14"/>
    </g>
  </g>
  <!-- outline again on top so the dots stay inside a crisp edge -->
  <path d="M262 522C262 360 372 250 512 250s250 110 250 272c0 26-20 40-50 40H312c-30 0-50-14-50-40Z"
        fill="none" stroke="#2b1a16" stroke-width="28" stroke-linejoin="round"/>
</svg>
