<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Cute cep. Drawn inside the central ~60% so it survives Android's adaptive-icon mask. -->
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5612f"/>
      <stop offset="1" stop-color="#7a4321"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf0d9"/>
      <stop offset="0.65" stop-color="#f1e1c0"/>
      <stop offset="1" stop-color="#dcc597"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="512" cy="772" rx="150" ry="20" fill="#000" opacity=".28"/>

  <!-- grass -->
  <path d="M372 770 C 360 730, 352 712, 336 700 C 362 708, 380 728, 388 760 Z" fill="#7fbf5a"/>
  <path d="M392 772 C 390 740, 396 718, 410 700 C 408 726, 408 748, 410 770 Z" fill="#94d06c"/>
  <path d="M652 770 C 664 730, 672 712, 688 700 C 662 708, 644 728, 636 760 Z" fill="#7fbf5a"/>

  <!-- stem -->
  <path d="M440 515 C 422 600, 380 694, 404 748 C 428 792, 596 792, 620 748 C 644 694, 602 600, 584 515 Z"
        fill="url(#stem)"/>

  <!-- pores under the cap -->
  <ellipse cx="512" cy="528" rx="200" ry="34" fill="#e9cf74"/>

  <!-- cap -->
  <path d="M296 522 C 296 362, 398 268, 512 268 C 626 268, 728 362, 728 522 C 728 552, 296 552, 296 522 Z"
        fill="url(#cap)"/>
  <ellipse cx="428" cy="350" rx="66" ry="30" fill="#fff" opacity=".22" transform="rotate(-28 428 350)"/>
  <circle cx="470" cy="304" r="10" fill="#fff" opacity=".22"/>

  <!-- face -->
  <ellipse cx="478" cy="628" rx="15" ry="21" fill="#2a1a10"/>
  <ellipse cx="546" cy="628" rx="15" ry="21" fill="#2a1a10"/>
  <circle cx="483" cy="619" r="5.5" fill="#fff"/>
  <circle cx="551" cy="619" r="5.5" fill="#fff"/>
  <ellipse cx="448" cy="664" rx="19" ry="10" fill="#f0867a" opacity=".7"/>
  <ellipse cx="576" cy="664" rx="19" ry="10" fill="#f0867a" opacity=".7"/>
  <path d="M496 668 Q 512 686 528 668" stroke="#2a1a10" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
